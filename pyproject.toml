[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syslogwatch"
version = "0.1.0"
description = "Lee syslog de routers/APs, detecta patrones de error, los prioriza y busca referencias externas"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
syslogwatch = "syslogwatch.cli:main"

[tool.setuptools.packages.find]
where = ["addon/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["addon/app"]
